name: Keep Render service warm

# Render's free tier spins the web service down after ~15 minutes of no
# traffic; the next real request (a Zalo webhook delivery, a customer visit)
# then pays a 20-30s cold-start penalty. Pinging on an interval well under
# that window keeps the instance warm so real requests stay fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production site
        run: curl -sf -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" https://lyleauthentic.onrender.com/
